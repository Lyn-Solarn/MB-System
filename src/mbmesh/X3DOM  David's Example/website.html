<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Makes the page scale correctly on mobile devices -->
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>X3DOM Root Viewer (GLB/glTF)</title>

  <!-- X3DOM core CSS (styles for the X3D canvas and internal UI bits) -->
    <link rel="stylesheet" href="https://www.x3dom.org/release/x3dom.css">
  <!-- X3DOM JS library (does the WebGL rendering + X3D DOM runtime) -->  
  <script src="https://www.x3dom.org/release/x3dom.js"></script>  <style>
    /* Hint to browser that we’re using dark UI colors */
    :root { color-scheme: dark; }

    /* Fullscreen app background and font */
    body { margin: 0; background:#0b0f14; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    /* Container that holds both the X3D view and the overlay UI panel */
    #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    /* X3D element takes the full window */
    x3d { width: 100%; height: 100%; display:block; }

    /* Floating control panel (HUD) */
    #panel {
      position: absolute;
      top: 12px; left: 12px;
      width: 320px;
      background: rgba(20, 24, 33, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px;
      backdrop-filter: blur(8px);
      color: #e7edf5;
      z-index: 10; /* stays above the 3D canvas */
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    #panel h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: .2px; }

    /* A horizontal row of buttons */
    .row { display:flex; gap: 8px; margin: 8px 0; }

    button {
      flex: 1; /* buttons expand to share row width */
      background: rgba(255,255,255,0.08);
      color: #e7edf5;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button:active { transform: translateY(1px); }

    /* Toggle row for checkboxes */
    .toggle { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin: 8px 0; }
    .toggle input { transform: scale(1.1); }

    /* Small helper text */
    .small { font-size: 12px; opacity: .85; line-height: 1.35; }

    /* Status text at the bottom of the panel */
    #status { margin-top: 8px; font-size: 12px; opacity: .9; }

    /* Code-style text (root URL) */
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; }
  </style>
</head>

<body>
<div id="app">
  <!-- UI overlay panel -->
  <div id="panel">
    <h1>Root Viewer (X3DOM)</h1>

    <div class="small">
      <!-- Explains the purpose of this viewer -->
      Loads <b>only the root</b> model first. Later you can add tile/LOD loading in the “Load Children” button.
      <br/>Root URL: <code id="rootUrlLabel"></code>
    </div>

    <!-- Buttons for root load + camera fit -->
    <div class="row">
      <button id="btnLoadRoot">Load Root</button>
      <button id="btnFit">Fit View</button>
    </div>

    <!-- Buttons for (future) children load + clearing the scene -->
    <div class="row">
      <button id="btnLoadChildren" title="Placeholder: load child tiles later">Load Children (later)</button>
      <button id="btnClear">Clear</button>
    </div>

    <!-- Checkbox: toggle wireframe (best-effort) -->
    <div class="toggle">
      <label for="chkWire">Wireframe</label>
      <input id="chkWire" type="checkbox" />
    </div>

    <!-- Checkbox: show a placeholder bounds box -->
    <div class="toggle">
      <label for="chkBounds">Show Bounds</label>
      <input id="chkBounds" type="checkbox" />
    </div>

    <!-- A small status indicator updated by JS -->
    <div id="status">Status: idle</div>
  </div>

  <!-- Main X3DOM viewer -->
  <x3d id="x3d">
    <scene>
      <!-- Navigation:
           EXAMINE = click-drag orbit behavior
           ANY = allow more navigation modes
           headlight=true = camera light enabled -->
      <navigationInfo type='"EXAMINE" "ANY"' headlight="true"></navigationInfo>

      <!-- A starting camera position -->
      <viewpoint id="vp" position="0 0 6" centerOfRotation="0 0 0"></viewpoint>

      <!-- Optional lights (headlight already helps, these add depth) -->
      <directionalLight direction="-1 -1 -1" intensity="0.8"></directionalLight>
      <directionalLight direction="1 1 1" intensity="0.35"></directionalLight>

      <!-- Background color -->
      <background skyColor="0.04 0.06 0.08"></background>

      <!-- Bounds box transform.
           render="false" hides it by default.
           This is just a placeholder box; later you’d scale/position it to your model bounds. -->
      <transform id="boundsXf" render="false">
        <shape>
          <appearance>
            <!-- emissiveColor makes it glow regardless of lighting -->
            <material emissiveColor="0.2 0.7 1" transparency="0.65"></material>
          </appearance>
          <!-- A 2x2x2 box at the origin -->
          <box size="2 2 2"></box>
        </shape>
      </transform>

      <!-- Root model container:
           We inject an <Inline> node into this transform using JavaScript.
           That Inline loads the root .glb/.gltf. -->
      <transform id="rootXf" translation="0 0 0" scale="1 1 1">
        <!-- Inline gets injected here -->
      </transform>

      <!-- Placeholder group:
           Later, children tiles (higher detail LODs) can be injected here. -->
      <group id="childrenGroup"></group>
    </scene>
  </x3d>
</div>

<script>
  // ===========================
  // CONFIG: set your root model
  // ===========================
  // Use .glb if possible (one file, fewer path issues).
  const ROOT_URL = "scene.gltf";  // <-- updated to correct path
  // Example: const ROOT_URL = "models/root.gltf";

  // ===========================
  // Grab references to key UI and X3D nodes
  // ===========================
  const statusEl = document.getElementById("status");     // the status label in the panel
  const x3dEl = document.getElementById("x3d");           // the <x3d> element (has runtime API)
  const rootXf = document.getElementById("rootXf");       // container transform for the root model
  const boundsXf = document.getElementById("boundsXf");   // the bounds box transform
  const childrenGroup = document.getElementById("childrenGroup"); // container for future child tiles

  // Show the root URL in the panel
  document.getElementById("rootUrlLabel").textContent = ROOT_URL;

  // Update the UI status line
  function setStatus(msg) {
    statusEl.textContent = "Status: " + msg;
  }

  // Remove any previously loaded root Inline from rootXf
  function clearRoot() {
    while (rootXf.firstChild) rootXf.removeChild(rootXf.firstChild);
  }

  // Remove any loaded child tiles from childrenGroup
  function clearChildren() {
    while (childrenGroup.firstChild) childrenGroup.removeChild(childrenGroup.firstChild);
  }

  // Load the root model by creating an <Inline> element dynamically
  function loadRoot() {
    clearRoot();               // ensure we don’t have multiple roots
    setStatus("loading root…"); // UI feedback

    // Create X3DOM Inline node (loads external 3D content)
    const inline = document.createElement("inline");
    // X3DOM expects url attribute in quotes-within-quotes format:
    // url='"path.glb"'   (notice the inner quotes)
    inline.setAttribute("url", ROOT_URL);
    // Namespacing helps avoid DEF name collisions when multiple models load
    inline.setAttribute("nameSpaceName", "root");

    // If imported content contains DEF nodes, map them to HTML ids
    // (can be useful for grabbing nodes later)
    inline.setAttribute("mapDEFToID", "true");

    // Best-effort load event — depending on X3DOM build, this may or may not fire reliably
    inline.addEventListener("load", () => {
      setStatus("root loaded");
      fitView(); // automatically frame the camera
    });

    // Insert the Inline into the scene graph: rootXf -> Inline -> (imported glTF)
    rootXf.appendChild(inline);

    // Fallback: if no load event, attempt to fit view after a short delay
    setTimeout(() => {
      if (statusEl.textContent.includes("loading")) {
        setStatus("root requested (if blank, adjust scale/camera or check console)");
        fitView();
      }
    }, 1200);
  }

  // Fit camera to show everything in the scene
  function fitView() {
    try {
      // showAll() computes a scene bounding box and frames the view
      x3dEl.runtime.showAll();
      setStatus("fit view");
    } catch (e) {
      // Some X3DOM builds may not expose showAll()
      setStatus("fit view (showAll not supported here)");
    }
  }

  // ===========================
  // UI event handlers
  // ===========================
      document.getElementById("btnFit").addEventListener("click", fitView);
    document.getElementById("btnFit").addEventListener("click", fitView);

  // Clear everything (root + children)
  document.getElementById("btnClear").addEventListener("click", () => {
    clearRoot();
    clearChildren();
    setStatus("cleared");
  });

  // Toggle placeholder bounds box visibility
  document.getElementById("chkBounds").addEventListener("change", (e) => {
    boundsXf.setAttribute("render", e.target.checked ? "true" : "false");
    setStatus(e.target.checked ? "bounds shown (placeholder)" : "bounds hidden");
  });

  // Toggle wireframe:
  // Note: This is not guaranteed to work for all imported glTF content in every X3DOM build.
  // Some builds expose runtime wireframe toggles, some don’t.
  document.getElementById("chkWire").addEventListener("change", (e) => {
    try {
      // If available, toggles wireframe mode in X3DOM
      x3dEl.runtime.toggleWireframe && x3dEl.runtime.toggleWireframe();
      setStatus("wireframe toggled");
    } catch (err) {
      setStatus("wireframe toggle not supported in this build");
    }
  });

  // Placeholder: where your LOD / child tile loading logic will go
  document.getElementById("btnLoadChildren").addEventListener("click", () => {
    // Later you’ll implement something like:
    // 1) parse a tileset / hierarchy structure
    // 2) decide which children to load based on camera distance/screen error
    // 3) create additional <Inline> nodes and append to childrenGroup
    setStatus("children loading not implemented yet (placeholder)");
  });

  // Auto-load root when page loads (comment out if you prefer manual)
  loadRoot();
</script>

</body>
</html>
