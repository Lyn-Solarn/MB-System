<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X3DOM Centered Scene</title>
<link rel="stylesheet" href="https://www.x3dom.org/release/x3dom.css">  
<script src="https://www.x3dom.org/release/x3dom.js"></script>  

<!-- Draco decoder for compressed glTF models -->
<script src="https://www.gstatic.com/draco/versioned/decoders/1.5.6/draco_decoder.js"></script>

<script>
// Configures X3DOM to use Draco decoder
document.addEventListener('DOMContentLoaded', function() {
    if (window.x3dom && x3dom.setDracoDecoderPath) {
        x3dom.setDracoDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    }
});


// Function to handle dropdown selection
function changeModel() {
    var dropdown = document.getElementById('modelSelector');
    var selectedModel = dropdown.value;
    
    // Get the inline element and change its URL
    var inline = document.querySelector('Inline');
    inline.setAttribute('url', selectedModel);
    
    // Reload the scene
    x3dom.reload();
}


</script>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000000;
}
x3d {
    width:100%;
    height:100%;
    border:none;
}


/* Dropdown menu styling */
.dropdown-container {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
}

#modelSelector {
    padding: 10px 15px;
    font-size: 16px;
    background-color: rgba(255, 255, 255, 0.9);
    border: 2px solid #333;
    border-radius: 5px;
    cursor: pointer;
    color: #333;
    font-family: Arial, sans-serif;
}

#modelSelector:hover {
    background-color: rgba(255, 255, 255, 1);
}


</style>
</head>

<body>


<!-- Dropdown Menu -->
<div class="dropdown-container">
    <select id="modelSelector" onchange="changeModel()">
        <option value="root.glb">Model 1 - Root</option>
        <option value="model2.glb">Model 2</option>
        <option value="model3.glb">Model 3</option>
        <option value="another_model.glb">Model 4</option>
    </select>
</div>


<x3d>
<scene>
    <Inline url="root.glb"></Inline>
    <!-- Interactive navigation modes -->
    <navigationInfo type='"examine"' id="navType"></navigationInfo>

    <!-- Proper centered camera -->
    <viewpoint position="0 0 6"
               centerOfRotation="0 0 0"
               fieldOfView="0.8">
    </viewpoint>

    <background skyColor="0.08 0.08 0.1"></background>

    <directionallight direction="-1 -1 -1" intensity="0.8"></directionallight>
    <directionallight direction="1 -0.5 0.5" intensity="0.4"></directionallight>

    <!-- Centered model -->
    <transform translation="0 0 0">
        </transform>

</scene>
</x3d>

</body>
</body>
</html>
